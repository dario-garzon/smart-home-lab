- id: '1784301758614'
  alias: 'Bedroom: Button 2 controls Zigbee lamp'
  description: Single click toggles the lamp, long press switches mode
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/bedroom_relay/action
    payload: toggle_l2
    id: single_click
  - trigger: mqtt
    topic: zigbee2mqtt/bedroom_relay/action
    payload: long_press_l2
    id: long_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: long_press
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.bedroom_ambient_mode
          state: 'off'
        then:
        - action: light.turn_on
          target:
            entity_id: light.bedroom_desk_bulb
          data:
            xy_color:
            - 1
            - 0.34
            brightness_pct: 1
            transition: 0
        - action: light.turn_on
          target:
            entity_id: light.bedroom_desk_bulb
          data:
            brightness_pct: 50
            transition: 0.7
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.bedroom_ambient_mode
        else:
        - action: light.turn_on
          target:
            entity_id: light.bedroom_desk_bulb
          data:
            color_temp_kelvin: 2700
            brightness_pct: 1
            transition: 0
        - action: light.turn_on
          target:
            entity_id: light.bedroom_desk_bulb
          data:
            brightness_pct: 25
            transition: 0.7
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bedroom_ambient_mode
    - conditions:
      - condition: trigger
        id: single_click
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedroom_desk_bulb
        data:
          transition: 0.4
  mode: single
- id: '1784315409841'
  alias: 'Bedroom: Desk light on at dusk when PC is on'
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_pc_online
    to: 'on'
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 3
  conditions:
  - condition: state
    entity_id: binary_sensor.bedroom_pc_online
    state:
    - 'on'
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 3
  - condition: state
    entity_id: light.bedroom_desk_bulb
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom_desk_bulb
    data:
      color_temp_kelvin: 2700
      brightness_pct: 0.1
      transition: 0
  - delay:
      milliseconds: 0
  - action: light.turn_on
    target:
      entity_id: light.bedroom_desk_bulb
    data:
      brightness_pct: 25
      transition: 0.7
  mode: single
