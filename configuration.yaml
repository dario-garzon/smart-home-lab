# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

wake_on_lan:

shell_command:
  shutdown_bedroom_pc: !secret bedroom_pc_shutdown_cmd

switch:
  - platform: wake_on_lan
    name: "Bedroom PC"
    mac: !secret bedroom_pc_mac
    host: !secret bedroom_pc_host
    broadcast_address: !secret bedroom_pc_broadcast
    turn_off:
      service: shell_command.shutdown_bedroom_pc

recorder:
  purge_keep_days: 7
  commit_interval: 5
  exclude:
    domains:
      - update
      - automation
    entities:
      - sun.sun